worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Temp paths writable without root
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Resolve original host (AppGW sets X-Original-Host) ──
    map $http_x_original_host $original_host {
        default $http_x_original_host;
        ''      $host;
    }

    # ── Extract VM name from hostname ──
    # Matches vm-ymms-openclaw-NN.* → vm-ymms-openclaw-NN
    # Non-VM hostnames (console.*) → empty string
    map $original_host $vm_name {
        ~^(?<name>vm-ymms-openclaw-\d+)\. $name;
        default "";
    }

    server {
        listen 8080;
        server_name _;

        # Azure DNS resolver — resolves Private DNS Zone (openclaw.internal)
        # valid=10s matches the low TTL we set on DNS records
        resolver 168.63.129.16 valid=10s;

        # ── EasyAuth callback (must be open) ──
        location /.auth/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $original_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # ── Health check (must be open, no auth) ──
        location = /healthz {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $original_host;
        }

        # ── VM proxy (internal, via error_page 418 trick) ──
        # Uses variable in proxy_pass → nginx resolves DNS per-request
        location @vm_proxy {
            set $vm_upstream $vm_name.openclaw.internal;
            proxy_pass http://$vm_upstream:18789;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Keep original hostname so Origin matches Host
            proxy_set_header Host $original_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Default: route by hostname ──
        location / {
            # If original host is a VM hostname, proxy to that VM via DNS
            error_page 418 = @vm_proxy;
            if ($vm_name != "") {
                return 418;
            }

            # Otherwise: Console UI (requires AAD login)
            set $login_scheme $http_x_forwarded_proto;
            if ($login_scheme = "") {
                set $login_scheme "https";
            }

            if ($http_x_ms_client_principal = "") {
                return 302 $login_scheme://$original_host/.auth/login/aad?post_login_redirect_uri=$login_scheme://$original_host$request_uri;
            }

            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $original_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-MS-CLIENT-PRINCIPAL-NAME $http_x_ms_client_principal_name;
        }
    }
}
