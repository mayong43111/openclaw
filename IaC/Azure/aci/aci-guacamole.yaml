apiVersion: 2021-09-01
location: westus3
name: aci-ymms-guacamole
tags:
  project: openclaw
  managed: manual
properties:
  osType: Linux
  restartPolicy: Always
  ipAddress:
    type: Private
    ports:
      - protocol: TCP
        port: 8080
  subnetIds:
    - id: /subscriptions/25741150-3c69-49ef-b192-934816cf1782/resourceGroups/rg-ymms-openclaw-infra/providers/Microsoft.Network/virtualNetworks/vnet-ymms-openclaw/subnets/snet-aci
  containers:
    - name: guacamole
      properties:
        image: guacamole/guacamole:1.5.5
        resources:
          requests:
            cpu: 0.5
            memoryInGb: 1.0
        ports:
          - port: 8080
            protocol: TCP
        environmentVariables:
          - name: GUACD_HOSTNAME
            value: "127.0.0.1"
          - name: GUACD_PORT
            value: "4822"
          - name: JSON_SECRET_KEY
            secureValue: "c74b61c7a638ccc64b0f6ab673a67134"
    - name: guacd
      properties:
        image: guacamole/guacd:1.5.5
        resources:
          requests:
            cpu: 0.5
            memoryInGb: 1.0
        environmentVariables: []
