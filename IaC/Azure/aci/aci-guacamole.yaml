apiVersion: 2021-09-01
location: westus3
name: aci-ymms-guacamole
tags:
  project: openclaw
  managed: manual
properties:
  osType: Linux
  restartPolicy: Always
  ipAddress:
    type: Private
    ports:
      - protocol: TCP
        port: 8080
  subnetIds:
    - id: /subscriptions/25741150-3c69-49ef-b192-934816cf1782/resourceGroups/rg-ymms-openclaw-infra/providers/Microsoft.Network/virtualNetworks/vnet-ymms-openclaw/subnets/snet-aci
  containers:
    - name: guacamole
      properties:
        image: guacamole/guacamole:1.5.5
        resources:
          requests:
            cpu: 0.5
            memoryInGb: 1.0
        ports:
          - port: 8080
            protocol: TCP
        environmentVariables:
          - name: GUACAMOLE_HOME
            value: /etc/guacamole
          - name: GUACD_HOSTNAME
            value: "127.0.0.1"
          - name: GUACD_PORT
            value: "4822"
        volumeMounts:
          - name: guac-config
            mountPath: /etc/guacamole
            readOnly: true
    - name: guacd
      properties:
        image: guacamole/guacd:1.5.5
        resources:
          requests:
            cpu: 0.5
            memoryInGb: 1.0
        environmentVariables: []
  volumes:
    - name: guac-config
      secret:
        guacamole.properties: Z3VhY2QtaG9zdG5hbWU6IDEyNy4wLjAuMQpndWFjZC1wb3J0OiA0ODIyCnVzZXItbWFwcGluZzogL2V0Yy9ndWFjYW1vbGUvdXNlci1tYXBwaW5nLnhtbApza2lwLWlmLXVuYXZhaWxhYmxlOiB0cnVlCg==
